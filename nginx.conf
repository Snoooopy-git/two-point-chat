# 双点聊天 - Nginx 反向代理配置
# 适用于 Alibaba Cloud Linux 3 / CentOS 8 / RHEL 8
# 配置文件路径: /etc/nginx/conf.d/chat.conf

server {
    listen 80;
    server_name _;  # 替换为你的服务器 IP 或域名

    # 日志
    access_log /var/log/nginx/chat-access.log;
    error_log  /var/log/nginx/chat-error.log;

    # 上传文件大小限制
    client_max_body_size 10m;

    # 前端静态文件（由 Node.js Express 托管，直接访问）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传的图片（带缓存）
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API 接口
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io WebSocket 连接
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;  # WebSocket 长连接保持 24h
        proxy_send_timeout 86400s;
    }
}
